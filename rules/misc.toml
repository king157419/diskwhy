# ───────── 游戏 / 外设 ─────────

[[rule]]
id = "steam-library"
owner = "Steam"
category = "userdata"
tier = "keep"
match = ['%ProgramFiles(x86)%\Steam\steamapps\common', '%ProgramFiles(x86)%\Steam\steamapps']
what = "Steam 里装的游戏"
why = "Steam 默认把游戏装在这里"
lose = "直接删文件夹 Steam 会认为游戏损坏；想腾空间请卸载或移到别的盘（存档多数在云端或文档里，但不是全部）。"
how = ["migrate", "manual"]
how_detail = "Steam → 设置 → 存储空间：添加 D 盘库，然后选中游戏“移动”过去；不玩的在库里右键“卸载”。"
refs = ["https://help.steampowered.com/en/faqs/view/4BD4-4528-6B2E-8327"]
verified_on = "2026-09-23"

[[rule]]
id = "steam-caches"
owner = "Steam"
category = "cache"
tier = "safe"
match = [
  '%ProgramFiles(x86)%\Steam\steamapps\shadercache',
  '%ProgramFiles(x86)%\Steam\appcache',
  '%ProgramFiles(x86)%\Steam\logs',
  '%ProgramFiles(x86)%\Steam\dumps',
  '%ProgramFiles(x86)%\Steam\depotcache',
]
what = "Steam 的着色器缓存、界面缓存、日志和崩溃记录"
why = "Steam 运行和下载时产生的缓存"
lose = "不丢游戏和存档；删掉后 Steam 首次启动稍慢，游戏着色器会重新编译。"
how = "delete"
how_detail = "完全退出 Steam 后删除；着色器缓存也可以在 Steam 设置 → 下载 里清理。"
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "logitech-ghub"
owner = "罗技 G HUB"
category = "app"
tier = "review"
match = ['%ProgramData%\LGHUB']
what = "罗技 G HUB（外设驱动软件）的公共数据和下载的组件"
why = "G HUB 下载的设备支持包、固件、更新都放在这里"
lose = "我不确定其中哪些能删：depots 看起来是下载的组件包，cache 看起来是缓存；删了 G HUB 可能要重新下载，或设备配置不能用。"
how = "manual"
how_detail = "不建议手动删；G HUB 本身占地方的话可以卸载后重装。"
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "raspberry-pi-imager-cache"
owner = "Raspberry Pi Imager"
category = "cache"
tier = "safe"
match = ['%LOCALAPPDATA%\Raspberry Pi\Raspberry Pi Imager\cache']
