[[rule]]
id = "aclos-game-recorder"
owner = "不确定（可能与腾讯《无畏契约》的“无畏时刻”录像有关）"
category = "userdata"
tier = "review"
match = ['%APPDATA%\ACLOS', '%USERPROFILE%\AppData\ACLOS']
what = "某个游戏相关程序的数据，以及它录下来的游戏视频"
why = "线索：Roaming\\ACLOS 是 Electron 程序的数据（Cache、GPUCache 等），还有 GameProxyCrashReports、TcVersions、Fixs；AppData\\ACLOS 下的 aclos-highlight、wonderfulVideos… 里是几 GB 的视频。网上有视频说《无畏契约》国服的“无畏时刻”自动录像默认存在 C 盘的 ACLOS 文件夹——没有找到官方说明，注册表里也没有登记，仅供参考"
lose = "录像删了就找不回来；程序文件删了，相关的录制 / 加速功能可能失效。Cache 类子文件夹有单独规则（可放心清）。"
how = "manual"
how_detail = "先确认是哪款软件（看游戏客户端里有没有“高光时刻 / 无畏时刻”之类的录像设置，一般能改保存位置）。录像想留就在软件里把保存位置改到别的盘再搬走；不想留就在软件里删。"
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "electron-updater-cache"
owner = "用 electron-builder 打包的软件"
category = "installer"
tier = "safe"
owner_from_path = true
kind = "dir"
match = ['%LOCALAPPDATA%\*-updater']
when_child = ["installer.exe", "pending", "update-info.json"]
what = "软件自动更新时下载下来的安装包"
why = "electron-builder 的自动更新模块把新版安装包下载到 %LOCALAPPDATA%\\<软件名>-updater（源码：app-builder-lib 的 updaterCacheDirName = 软件名小写 + \"-updater\"，electron-updater 的缓存根目录在 Windows 上是 LOCALAPPDATA）"
lose = "只是已经下载的更新安装包；删了下次更新会重新下载。软件正提示“重启以安装更新”时先完成更新再删。"
how = "delete"
how_detail = "退出对应软件后删除整个文件夹即可。"
refs = [
  "https://github.com/electron-userland/electron-builder/blob/master/packages/app-builder-lib/src/appInfo.ts",
  "https://github.com/electron-userland/electron-builder/blob/master/packages/electron-updater/src/AppAdapter.ts",
]
verified_on = "2026-09-23"

