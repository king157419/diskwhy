lose = "装好的驱动不受影响；以后回滚或重装驱动时需要重新下载。我不确定 NVIDIA App 会不会在下次检查更新时把它们重新下回来。"
how = "delete"
how_detail = "需要管理员权限。先退出 NVIDIA App 再删；或在 NVIDIA App 设置里关掉自动下载驱动。"
refs = []
