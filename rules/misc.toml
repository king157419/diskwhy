[[rule]]
id = "steam-caches"
owner = "Steam"
category = "cache"
tier = "safe"
match = [
  '%ProgramFiles(x86)%\Steam\steamapps\shadercache',
  '%ProgramFiles(x86)%\Steam\appcache',
  '%ProgramFiles(x86)%\Steam\logs',
  '%ProgramFiles(x86)%\Steam\dumps',
  '%ProgramFiles(x86)%\Steam\depotcache',
]
what = "Steam 的着色器缓存、界面缓存、日志和崩溃记录"
why = "Steam 运行和下载时产生的缓存"
lose = "不丢游戏和存档；删掉后 Steam 首次启动稍慢，游戏着色器会重新编译。"
how = "delete"
how_detail = "完全退出 Steam 后删除；着色器缓存也可以在 Steam 设置 → 下载 里清理。"
refs = []
verified_on = "2026-09-23"

# B-2（S22）：游戏平台缓存第二批。

[[rule]]
id = "steam-htmlcache"
owner = "Steam"
category = "cache"
tier = "review"
match = ['%LOCALAPPDATA%\Steam\htmlcache']
what = "Steam 内置浏览器的数据（商店、社区、好友界面都是网页做的）"
why = "Steam 客户端用 Chromium 内核显示商店和社区页面，网页缓存、显卡着色器缓存和网页登录信息都放在这里"
lose = "游戏、存档和 Steam 账号本身不受影响；删了商店页面第一次打开会慢，内置网页里的登录状态和网页设置可能要重来。我没找到 Valve 官方对这个文件夹的说明，所以整个文件夹标“需要你判断”；里面的 Cache、Code Cache、GPUCache 等子文件夹 DiskWhy 会单独认出来。"
how = "delete"
how_detail = "完全退出 Steam（托盘图标右键退出）后再删；Steam 下次启动会重建。"
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "epic-launcher-webcache"
owner = "Epic Games 启动器"
category = "cache"
tier = "safe"
match = ['%LOCALAPPDATA%\EpicGamesLauncher\Saved\webcache*']
what = "Epic Games 启动器的网页缓存"
why = "启动器的商店和库界面是网页做的，缓存放在 webcache（有的版本叫 webcache_4147、webcache_4430）"
lose = "不丢游戏、存档和账号；删了启动器第一次打开会慢一点。Epic 官方客服文章把删这些文件夹当作修启动器显示问题的办法。"
how = "delete"
how_detail = "右键托盘里的 Epic 图标 → 退出，然后删掉 %LOCALAPPDATA%\\EpicGamesLauncher\\Saved 下的 webcache、webcache_4147、webcache_4430，再打开启动器。"
refs = ["https://www.epicgames.com/help/en-US/epic-games-store-c-202300000001639/launcher-support-c-202300000001735/how-do-i-clear-the-launcher-cache-on-pc-a202300000013316"]
verified_on = "2026-09-23"

[[rule]]
id = "battlenet-cache"
owner = "暴雪 Battle.net"
category = "cache"
tier = "safe"
match = ['%ProgramData%\Blizzard Entertainment']
what = "暴雪 Battle.net 的缓存文件夹"
