<!doctype html>
<html lang="zh-CN" data-theme="A">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>DiskWhy</title>
    <!-- 不让浏览器 / WebView 自己去要 /favicon.ico（没有这个文件，控制台会报 404） -->
    <link rel="icon" href="data:," />
    <script>
      // 样式加载前就设好主题（A 浅色 / B 深色 / C 趣味），避免启动时闪一下别的颜色。
      // 真正的存档在 %LOCALAPPDATA%\DiskWhy\ui.json，src/theme.ts 启动后会再读一次。
      try {
        var t = localStorage.getItem("diskwhy.theme3");
        if (t !== "A" && t !== "B" && t !== "C") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "B" : "A";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <style>
      html { background: #f3f1ec; }
      html[data-theme="B"] { background: #14110e; }
      html[data-theme="C"] { background: #f4f0e6; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
