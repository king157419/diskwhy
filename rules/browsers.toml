# ───────── Chromium / Electron 通配 ─────────

[[rule]]
id = "chromium-generic-cache"
owner = "Chromium / Electron 程序"
category = "cache"
tier = "safe"
owner_from_path = true
match = ['%APPDATA%\**\Cache', '%LOCALAPPDATA%\**\Cache']
when_child = ["Cache_Data", "data_0", "data_1"]
what = "网页缓存（Chromium 内核程序通用格式）"
why = "浏览器或 Electron 应用（VS Code、Cursor、Claude、Discord、飞书、QQ 等）显示界面、打开网页时把图片和脚本存一份，下次更快"
lose = "不丢聊天记录、文档和设置；删掉后程序第一次打开某些页面会慢一点，需要重新加载。"
how = "delete"
how_detail = "先完全退出对应程序（包括托盘图标），再删除；程序下次启动自动重建。"
refs = ["https://www.chromium.org/developers/design-documents/network-stack/disk-cache/"]
verified_on = "2026-09-23"

[[rule]]
id = "chromium-generic-code-cache"
owner = "Chromium / Electron 程序"
category = "cache"
tier = "safe"
owner_from_path = true
match = ['%APPDATA%\**\Code Cache', '%LOCALAPPDATA%\**\Code Cache', '%APPDATA%\**\CodeCache']
when_child = ["js", "wasm"]
what = "脚本编译缓存（Chromium 内核程序通用）"
why = "把网页和界面里的 JavaScript 编译结果存下来，启动更快"
lose = "不丢数据；删掉后程序头一两次启动稍慢。"
how = "delete"
how_detail = "退出对应程序后删除。"
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "chromium-generic-gpu-cache"
owner = "Chromium / Electron 程序"
category = "cache"
tier = "safe"
owner_from_path = true
match = [
  '%APPDATA%\**\GPUCache', '%LOCALAPPDATA%\**\GPUCache',
  '%APPDATA%\**\DawnCache', '%LOCALAPPDATA%\**\DawnCache',
  '%APPDATA%\**\DawnGraphiteCache', '%LOCALAPPDATA%\**\DawnGraphiteCache',
  '%APPDATA%\**\DawnWebGPUCache', '%LOCALAPPDATA%\**\DawnWebGPUCache',
  '%APPDATA%\**\GrShaderCache', '%LOCALAPPDATA%\**\GrShaderCache',
  '%APPDATA%\**\GraphiteDawnCache', '%LOCALAPPDATA%\**\GraphiteDawnCache',
  '%APPDATA%\**\ShaderCache', '%LOCALAPPDATA%\**\ShaderCache',
]
when_child = ["index", "data_0"]
what = "显卡着色器缓存（Chromium 内核程序通用）"
why = "程序用显卡画界面时把编译好的着色器存下来"
lose = "不丢数据；删掉后界面头一次打开可能短暂卡一下。"
how = "delete"
how_detail = "退出对应程序后删除。"
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "chromium-generic-sw-cache"
owner = "Chromium / Electron 程序"
category = "cache"
tier = "safe"
owner_from_path = true
match = [
  '%APPDATA%\**\Service Worker\CacheStorage', '%LOCALAPPDATA%\**\Service Worker\CacheStorage',
  '%APPDATA%\**\Service Worker\ScriptCache', '%LOCALAPPDATA%\**\Service Worker\ScriptCache',
]
what = "网页离线缓存（Service Worker 缓存）"
why = "网页应用（比如在线文档、网页版工具，以及飞书等 Electron 应用的内置网页）把资源存到本地，下次秒开，有的还能离线用"
lose = "不丢账号数据（服务器上有）；删掉后这些网页应用第一次打开会重新下载资源，离线状态下暂时打不开。"
how = "delete"
how_detail = "退出对应程序后删除；程序会按需重新缓存。"
refs = ["https://developer.mozilla.org/en-US/docs/Web/API/CacheStorage"]
verified_on = "2026-09-23"

[[rule]]
id = "crashpad-reports"
owner = "Chromium / Electron 程序"
category = "log"
tier = "safe"
owner_from_path = true
match = ['%APPDATA%\**\Crashpad', '%LOCALAPPDATA%\**\Crashpad', '%LOCALAPPDATA%\**\Crash Reports']
what = "程序崩溃报告"
why = "程序崩溃时记录现场，准备上传给开发者"
lose = "只是丢掉以前的崩溃记录，不影响使用。"
how = "delete"
how_detail = "直接删除即可。"
refs = []
verified_on = "2026-09-23"
