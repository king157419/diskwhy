[package]
name = "diskwhy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DiskWhy 桌面壳（Tauri 2，只做 IPC 转发）"
authors = ["DiskWhy contributors"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "diskwhy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
diskwhy-core = { path = "../crates/diskwhy-core" }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# 阶段 J 闪退取证：WebView2 浏览器 / 渲染进程挂了要活下来并记录（CoreWebView2.add_ProcessFailed）。
# 版本和 Tauri（wry / tauri-runtime-wry）用的一致：webview2-com 0.38.2、windows-core 0.61.2 都已在 Cargo.lock 里。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
