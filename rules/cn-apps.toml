# 国内常用软件。文案均为 DiskWhy 自己撰写（MIT）。
# 原则：聊天记录、收到的文件、下载的音乐视频 → keep（可迁移）；渲染缓存、日志、更新包 → safe；
# 说不清的 → review，并写明线索。
# 注意：Documents 下的子文件夹即使是缓存也只能标 review（校验规定 safe 不许落在文档等个人文件夹里）。

# ───────── 微信 ─────────

[[rule]]
id = "wechat-files"
owner = "微信"
category = "userdata"
tier = "keep"
match = ['%USERPROFILE%\Documents\WeChat Files', '%USERPROFILE%\Documents\xwechat_files']
what = "微信的聊天记录、收到的图片视频和文件"
why = "微信默认把所有聊天数据存在“文档”里（WeChat Files 是旧版 3.x，xwechat_files 是新版 4.x）"
lose = "删了聊天记录、收到的文件、图片、视频都会丢，手机上没有的就再也找不回来。"
how = "migrate"
how_detail = "在微信里改存储位置：微信左下角“≡”→ 设置 → 文件管理（新版叫“存储空间”或“存储位置”）→ 更改，选 D 盘的文件夹，微信会自己搬过去并重启。也可以在同一页面“清理”选择性删除大文件。"
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "wechat-files-cache"
owner = "微信"
category = "cache"
tier = "review"
match = ['%USERPROFILE%\Documents\xwechat_files\*\cache', '%USERPROFILE%\Documents\WeChat Files\*\FileStorage\Cache']
what = "微信聊天数据里的缓存部分（缩略图、临时文件等）"
why = "微信为了显示更快缓存的内容"
lose = "多数是能重新生成的缓存，但它就在聊天数据旁边，DiskWhy 不能百分之百确认，所以标“需要你判断”。更稳妥的做法是用微信自带的清理功能。"
how = "builtin_tool"
how_detail = "微信 → 设置 → 存储空间（文件管理）→ 清理缓存。"
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "wechat-render-cache"
owner = "微信"
category = "cache"
tier = "safe"
match = [
  '%APPDATA%\Tencent\xwechat\radium',
  '%APPDATA%\Tencent\WeChat\radium',
  '%APPDATA%\Tencent\xwechat\xplayer',
]
