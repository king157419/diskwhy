[[rule]]
id = "nvidia-app-updates"
owner = "NVIDIA App"
category = "installer"
tier = "review"
lose_kind = "repair"
lose_short = "重装驱动要重下"
match = ['%ProgramData%\NVIDIA Corporation\NVIDIA App\UpdateFramework\ota-artifacts', '%ProgramData%\NVIDIA Corporation\Downloader']
what = "NVIDIA App（或旧的 GeForce Experience）下载的驱动和程序更新包"
why = "本机看到：ota-artifacts\\grd 是 Game Ready 驱动（下载的压缩包 + post-processing 里解压出的 setup.exe、Display.Driver 等完整安装程序），nvapp 是 NVIDIA App 自己的更新包，其余 GUID 名字的文件夹是空的。装好的驱动 Windows 另存在 System32\\DriverStore（驱动仓库）里，不靠这些安装包运行"
lose = "装好的驱动不受影响；以后想回滚或重装同一版驱动时要重新下载。NVIDIA 没有公开说明这个文件夹，我不确定 NVIDIA App 会不会在下次检查更新时把它们重新下回来（NVIDIA 论坛上有用户说大头就是这里的旧驱动）。"
how = "delete"
how_detail = "需要管理员权限。先退出 NVIDIA App，再删 grd、nvapp 里的内容（文件夹本身留着）；或在 NVIDIA App 设置里关掉自动下载驱动。"
refs = [
  "https://learn.microsoft.com/en-us/windows-hardware/drivers/install/driver-store",
  "https://www.nvidia.com/en-us/geforce/forums/geforce-graphics-cards/5/558143/what-can-be-deleted-from-the-cprogramdatanvidia-co",
]
verified_on = "2026-09-24"

[[rule]]
id = "nvidia-driver-installers"
owner = "NVIDIA App"
category = "installer"
tier = "review"
lose_kind = "repair"
lose_short = "重装驱动要重下"
match = [
  '%ProgramData%\NVIDIA Corporation\NVIDIA App\UpdateFramework\ota-artifacts\grd',
  '%ProgramData%\NVIDIA Corporation\NVIDIA App\UpdateFramework\ota-artifacts\crd',
]
what = "NVIDIA App 下载的显卡驱动安装包（grd = Game Ready 驱动，crd = Studio 驱动）"
why = "NVIDIA App 更新驱动时先把驱动包下载到这里（按哈希命名的文件夹），再解压到 post-processing 里运行安装（里面是 setup.exe、Display.Driver、HDAudio、PhysX 等，和官网下载的驱动安装程序内容一样）。装好之后，Windows 会把驱动存进 System32\\DriverStore，系统用的是那一份"
lose = "只是安装包：删了显卡驱动照常工作，想重装或回滚到这一版时要重新下载（约 1 GB 的压缩包，解压后 3 GB 左右）。"
how = "delete"
how_detail = "需要管理员权限。先退出 NVIDIA App 再删里面的内容；如果正在安装驱动，等装完再删。"
refs = [
  "https://learn.microsoft.com/en-us/windows-hardware/drivers/install/driver-store",
  "https://nvidia.custhelp.com/app/answers/detail/a_id/10/~/nvidia-app-driver-installation-failed.-how-do-i-manually-clean-install-the",
]
verified_on = "2026-09-24"

