[[rule]]
id = "gradle-cache"
owner = "Gradle"
category = "cache"
tier = "safe"
match = ['%USERPROFILE%\.gradle\caches', '%USERPROFILE%\.gradle\wrapper\dists']
what = "Gradle 的依赖缓存和下载的 Gradle 版本"
why = "Android / Java 项目构建时下载的库和构建工具"
lose = "不丢代码；下次构建会重新下载，可能要很久。"
how = "delete"
how_detail = "关掉 Android Studio / IDE 和 Gradle 守护进程（gradle --stop）后删除。"
refs = ["https://docs.gradle.org/current/userguide/directory_layout.html"]
verified_on = "2026-09-23"

[[rule]]
id = "maven-repo"
owner = "Maven"
category = "cache"
tier = "review"
match = ['%USERPROFILE%\.m2\repository']
what = "Maven 本地仓库（下载的 Java 依赖）"
why = "Java 项目构建时下载的库"
lose = "大部分能重新下载；但如果你用 mvn install 装过自己的包或公司内部包，那些删了就要重新构建，可能找不回来。"
how = "delete"
how_detail = "确认没有只在本机的包后删除，下次构建自动重新下载。"
refs = ["https://maven.apache.org/guides/introduction/introduction-to-repositories.html"]
verified_on = "2026-09-23"

[[rule]]
id = "nuget-cache"
owner = "NuGet（.NET）"
category = "cache"
tier = "safe"
match = ['%USERPROFILE%\.nuget\packages', '%LOCALAPPDATA%\NuGet\v3-cache', '%LOCALAPPDATA%\NuGet\plugins-cache', '%LOCALAPPDATA%\NuGet\Cache']
what = "NuGet 下载的 .NET 包缓存"
why = ".NET 项目还原依赖时下载的包"
lose = "不丢代码；下次构建会重新下载。"
how = ["builtin_tool", "delete"]
how_detail = "dotnet nuget locals all --clear"
refs = ["https://learn.microsoft.com/en-us/nuget/consume-packages/managing-the-global-packages-and-cache-folders"]
verified_on = "2026-09-23"

# ───────── Docker / WSL ─────────

[[rule]]
id = "docker-data-vhdx"
owner = "Docker Desktop"
category = "vm"
tier = "keep"
match = [
  '%LOCALAPPDATA%\Docker\wsl\disk\docker_data.vhdx',
  '%LOCALAPPDATA%\Docker\wsl\disk',
  '%LOCALAPPDATA%\Docker\wsl\data\ext4.vhdx',
  '%LOCALAPPDATA%\Docker\wsl\data',
]
what = "Docker Desktop 的数据盘：所有镜像、容器、数据卷都在这一个虚拟磁盘文件里"
why = "Docker Desktop 用 WSL 2 跑一个 Linux，镜像和容器存在这个 .vhdx 里；它只会变大不会自动变小"
lose = "删了等于删掉全部镜像、容器和数据卷（包括数据库容器里的数据），无法恢复。"
how = ["migrate", "builtin_tool"]
how_detail = "迁移：Docker Desktop → Settings → Resources → Advanced → Disk image location，改到 D 盘，点 Apply，Docker 会自己搬过去。清理：docker system prune -a（删掉没在用的镜像和容器）和 docker builder prune（删构建缓存）；清完文件不会自动缩小，需要再压缩虚拟磁盘。不要直接删这个文件。"
refs = ["https://docs.docker.com/desktop/settings-and-maintenance/settings/", "https://docs.docker.com/reference/cli/docker/system/prune/"]
verified_on = "2026-09-23"

[[rule]]
id = "docker-wsl"
owner = "Docker Desktop"
category = "vm"
tier = "keep"
match = ['%LOCALAPPDATA%\Docker\wsl']
what = "Docker Desktop 的 WSL 虚拟磁盘文件夹"
why = "main 里是 Docker 自己的小 Linux 系统，disk 里是你的镜像和容器数据"
lose = "删了 Docker Desktop 会坏掉，镜像和容器全部丢失。"
how = "migrate"
how_detail = "Docker Desktop → Settings → Resources → Advanced → Disk image location 改到别的盘。"
refs = ["https://docs.docker.com/desktop/settings-and-maintenance/settings/"]
verified_on = "2026-09-23"

[[rule]]
id = "docker-local"
owner = "Docker Desktop"
category = "vm"
tier = "review"
scope = "self"
match = ['%LOCALAPPDATA%\Docker']
what = "Docker Desktop 的本机数据（虚拟磁盘、日志、安装记录）"
why = "wsl 子文件夹是最大的部分（镜像和容器），log 是日志"
lose = "不能整个删，wsl 里是你的镜像和容器。请点进去看：log 可以清。"
how = "none"
how_detail = ""
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "docker-logs"
owner = "Docker Desktop"
category = "log"
tier = "safe"
match = ['%LOCALAPPDATA%\Docker\log']
what = "Docker Desktop 的运行日志"
why = "记录 Docker Desktop 运行情况，出问题时排查用"
lose = "只是丢掉旧日志，不影响镜像和容器。"
how = "delete"
how_detail = "退出 Docker Desktop 后删除。"
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "docker-program"
owner = "Docker Desktop"
category = "app"
tier = "keep"
match = ['%ProgramFiles%\Docker']
what = "Docker Desktop 的程序本体"
why = "安装 Docker Desktop 时放的程序文件"
lose = "直接删 Docker 就用不了。不用了请正常卸载。"
how = "manual"
how_detail = "“设置 > 应用”里卸载 Docker Desktop（卸载前如有需要，先导出重要的镜像和数据卷）。"
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "wsl-distro-vhdx"
owner = "WSL（适用于 Linux 的 Windows 子系统）"
category = "vm"
tier = "keep"
match = [
  '%LOCALAPPDATA%\wsl\*\ext4.vhdx',
  '%LOCALAPPDATA%\wsl\*',
  '%LOCALAPPDATA%\Packages\*\LocalState\ext4.vhdx',
]
what = "WSL 里某个 Linux 发行版的整块硬盘（ext4.vhdx）"
why = "你装的 Ubuntu 等 Linux 发行版，系统和你在里面的所有文件都存在这个虚拟磁盘文件里；它只会变大不会自动变小"
lose = "删了等于把这个 Linux 连同里面所有文件一起删掉，无法恢复。"
how = "migrate"
how_detail = "迁到 D 盘（先 wsl --shutdown）：新版 WSL 可直接 wsl --manage <发行版名> --move D:\\WSL\\<发行版名>；旧版用 wsl --export <发行版名> D:\\backup.tar → wsl --unregister <发行版名> → wsl --import <发行版名> D:\\WSL\\<发行版名> D:\\backup.tar。发行版名用 wsl -l -v 查看。不用的发行版用 wsl --unregister 删除。"
refs = ["https://learn.microsoft.com/en-us/windows/wsl/basic-commands", "https://learn.microsoft.com/en-us/windows/wsl/disk-space"]
verified_on = "2026-09-23"

[[rule]]
id = "wsl-root"
owner = "WSL"
category = "vm"
tier = "keep"
scope = "self"
match = ['%LOCALAPPDATA%\wsl']
what = "新版 WSL 存放 Linux 发行版虚拟磁盘的文件夹"
why = "每个子文件夹（一串 GUID）是一个发行版"
lose = "不能删，里面是你的 Linux 系统和文件。"
how = "migrate"
how_detail = "用 wsl --manage <发行版名> --move <新位置> 或 export/import 迁移，见子文件夹说明。"
refs = ["https://learn.microsoft.com/en-us/windows/wsl/basic-commands"]
verified_on = "2026-09-23"

[[rule]]
id = "wsl-program"
owner = "WSL"
category = "app"
tier = "keep"
match = ['%ProgramFiles%\WSL']
what = "WSL 的程序本体"
why = "新版 WSL 作为独立程序安装在这里"
lose = "删了 WSL 和 Docker Desktop 都用不了。"
how = "none"
how_detail = ""
refs = []
verified_on = "2026-09-23"

