why = "打开公众号文章、小程序、视频号时，微信把网页资源和小程序包存在这里"
lose = "不丢聊天记录；删掉后小程序、公众号文章要重新加载，个别小程序可能需要重新登录。"
how = ["delete", "builtin_tool"]
how_detail = "先完全退出微信（托盘图标右键退出），再删除；或用微信“设置 → 存储空间 → 清理缓存”。"
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "wechat-logs"
owner = "微信"
category = "log"
tier = "safe"
match = [
  '%APPDATA%\Tencent\xwechat\log',
  '%APPDATA%\Tencent\xwechat\crashinfo',
  '%APPDATA%\Tencent\WeChat\log',
  '%APPDATA%\Tencent\WeChat\xweb\crash',
