<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DiskWhy C 首页</title>
<style>
  :root{
    --lime:#D3F24B; --lime-deep:#B9DB2C; --ink:#121410; --ink2:#4A4E44; --ink3:#8B8F83;
    --cream:#F4F1E8; --paper:#FFFFFF; --cost:#FF8A7A; --line:#1B1D18;
    --sans:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
    --num:"Bahnschrift","Segoe UI Variable Display","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1440px;height:900px;overflow:hidden}
  body{background:var(--cream);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;position:relative}
  .num{font-family:var(--num);font-variant-numeric:tabular-nums}

  .block{position:absolute;left:0;top:0;right:0;height:610px;background:var(--lime);overflow:hidden}
  .block::before{content:"";position:absolute;inset:0;opacity:.35;
    background-image:radial-gradient(rgba(18,20,16,.14) 1px,transparent 1.2px);background-size:22px 22px;
    -webkit-mask-image:linear-gradient(90deg,transparent 45%,#000 80%)}

  .titlebar{position:relative;z-index:3;height:52px;display:flex;align-items:center;padding-left:28px}
  .brand{font-size:14px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
  .brand i{width:14px;height:14px;border-radius:4px;background:var(--ink);display:inline-block;transform:rotate(12deg)}
  .spacer{flex:1}
  .iconbtn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--ink)}
  .win{display:flex;margin-left:6px}
  .win span{width:46px;height:52px;display:grid;place-items:center;color:var(--ink2)}

  .hero{position:absolute;left:96px;top:118px;z-index:2}
  .hero .k{font-size:22px;font-weight:700;letter-spacing:1px}
  .hero .big{display:flex;align-items:baseline;line-height:.82;margin-top:34px}
  .hero .n{font-size:330px;font-weight:700;letter-spacing:-12px;font-stretch:condensed}
  .hero .u{font-size:92px;font-weight:700;margin-left:18px;letter-spacing:-2px}
  .go{margin-top:44px;width:260px;height:72px;border-radius:36px;background:var(--ink);color:var(--lime);font-size:22px;font-weight:700;letter-spacing:8px;
    display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 18px 30px -18px rgba(0,0,0,.6)}

  .art{position:absolute;right:40px;top:60px;width:620px;height:560px;z-index:1}

  .lower{position:absolute;left:96px;right:96px;top:610px;bottom:0;display:flex;align-items:center}
  .stat{margin-right:72px}
  .stat .k{font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:8px;font-weight:600}
  .stat .k i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .stat .v{margin-top:8px;font-size:56px;font-weight:700;line-height:1;letter-spacing:-1px}
  .stat .v small{font-size:22px;margin-left:6px;letter-spacing:0;color:var(--ink2)}
  .disk{width:300px}
  .bar{margin-top:18px;height:14px;border-radius:7px;border:2px solid var(--ink);display:flex;overflow:hidden;background:var(--paper)}
  .bar div{height:100%;border-right:2px solid var(--ink)}
  .more{height:64px;padding:0 28px 0 32px;border-radius:32px;border:2px solid var(--ink);display:flex;align-items:center;gap:14px;font-size:18px;font-weight:700;background:var(--paper)}
  .more .arr{width:36px;height:36px;border-radius:18px;background:var(--ink);color:var(--lime);display:grid;place-items:center}
</style>
</head>
<body>
  <div class="block"></div>

  <div class="titlebar">
    <div class="brand"><i></i>DiskWhy</div>
    <div class="spacer"></div>
    <div class="iconbtn">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </div>
    <div class="win">
      <span><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"/></svg></span>
      <span><svg width="10" height="10" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor"/></svg></span>
      <span><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></span>
    </div>
  </div>

  <div class="hero">
    <div class="k">可放心清理</div>
    <div class="big num"><span class="n">32.1</span><span class="u">GB</span></div>
    <div class="go">清理
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </div>
  </div>

  <!-- 插画：一台"磁盘"，文件块被扫出去 -->
  <svg class="art" viewBox="0 0 620 560" fill="none" stroke="#121410" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- 地面阴影 -->
    <ellipse cx="300" cy="500" rx="210" ry="18" fill="#121410" fill-opacity=".12" stroke="none"/>
    <!-- 磁盘本体 -->
    <path d="M110 420 L150 340 H450 L490 420 Z" fill="#FFFFFF"/>
    <rect x="110" y="420" width="380" height="72" rx="14" fill="#FFFFFF"/>
    <path d="M150 456 H330" stroke-width="3"/>
    <circle cx="440" cy="456" r="10" fill="#D3F24B"/>
    <circle cx="410" cy="456" r="5" fill="#121410" stroke="none"/>
    <!-- 盘里还剩的几块 -->
    <rect x="178" y="296" width="74" height="60" rx="10" fill="#F4F1E8" transform="rotate(-4 215 326)"/>
    <rect x="262" y="286" width="74" height="70" rx="10" fill="#121410"/>
    <path d="M280 306 h38 M280 320 h24" stroke="#D3F24B" stroke-width="3"/>
    <rect x="346" y="300" width="70" height="56" rx="10" fill="#FFFFFF" transform="rotate(5 381 328)"/>
    <!-- 飞出去的块 -->
    <g transform="rotate(-14 300 220)">
      <rect x="262" y="190" width="80" height="64" rx="12" fill="#FFFFFF"/>
      <path d="M280 212 h44 M280 228 h28"/>
    </g>
    <g transform="rotate(18 420 150)">
      <rect x="386" y="116" width="72" height="62" rx="12" fill="#FF8A7A"/>
    </g>
    <g transform="rotate(-28 520 70)">
      <rect x="494" y="44" width="54" height="46" rx="10" fill="#FFFFFF"/>
    </g>
    <g transform="rotate(30 200 130)">
      <rect x="176" y="108" width="46" height="40" rx="9" fill="#121410"/>
    </g>
    <!-- 速度线 -->
    <path d="M226 262 l-26 30 M246 272 l-18 22 M360 186 l-22 26 M470 96 l-16 20 M488 112 l-12 14"/>
    <!-- 小星点 -->
    <path d="M560 180 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z" fill="#FFFFFF"/>
    <path d="M120 230 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z" fill="#121410" stroke="none"/>
    <circle cx="350" cy="70" r="6" fill="#121410" stroke="none"/>
  </svg>

  <div class="lower">
    <div class="stat">
      <div class="k"><i style="background:var(--cost);outline:2px solid var(--ink)"></i>有代价</div>
      <div class="v num">49.6<small>GB</small></div>
    </div>
    <div class="stat disk">
      <div class="k"><i style="background:var(--ink)"></i>C 盘</div>
      <div class="v num">185<small>/ 199 GB</small></div>
    </div>
    <div class="spacer"></div>
    <div class="more">看看都是什么
      <span class="arr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </div>
  </div>
</body>
</html>
