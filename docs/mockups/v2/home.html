<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DiskWhy v2 · 首页</title>
<script>document.documentElement.dataset.theme=(new URLSearchParams(location.search).get('t')||'A').toUpperCase()</script>
<link rel="stylesheet" href="theme.css">
<style>
  /* ── 左：主角 ── */
  .hero{position:absolute;left:0;top:0;width:900px;height:900px}
  .hero-in{position:absolute;left:var(--gutter);top:212px}
  .eyebrow{display:flex;align-items:center;gap:10px;font-size:var(--fs-group);font-weight:var(--w-med);color:var(--ink2)}
  .eyebrow .cnt{font-size:var(--fs-sub);color:var(--ink3);font-weight:var(--w-reg);margin-left:4px}
  .big{display:flex;align-items:baseline;gap:18px;margin-top:22px;color:var(--ink)}
  .big .n{font-size:300px}
  .big .u{font-family:var(--ui);font-size:40px;font-weight:var(--w-med);color:var(--ink2);letter-spacing:.02em}
  .split{margin-top:34px;display:flex;gap:0;font-size:var(--fs-sub);color:var(--ink3)}
  .split span{padding:0 18px;border-left:1px solid var(--line)}
  .split span:first-child{padding-left:0;border-left:0}
  .split b{font-family:var(--ui);font-variant-numeric:tabular-nums;font-weight:var(--w-med);color:var(--ink);font-size:15px;margin-left:6px}
  .actions{margin-top:48px;display:flex;align-items:center;gap:32px}
  .foot{position:absolute;left:var(--gutter);bottom:30px;font-size:var(--fs-meta);color:var(--ink3);display:flex;gap:14px}
  .foot i{font-style:normal;color:var(--line2)}

  /* ── 右：C 盘容量柱 ── */
  .disk{position:absolute;left:884px;top:96px;width:500px}
  .disk-h{display:flex;align-items:baseline;gap:14px}
  .disk-h .lbl{font-size:var(--fs-group);font-weight:var(--w-semi);color:var(--ink)}
  .disk-h .pct{margin-left:auto;font-size:var(--fs-sub);color:var(--ink2)}
  .disk-h .pct b{font-family:var(--ui);font-weight:var(--w-semi);color:var(--review-ink)}
  .disk-read{margin-top:6px;display:flex;align-items:baseline;gap:10px;color:var(--ink)}
  .disk-read .a{font-family:var(--display);font-weight:var(--display-w);letter-spacing:var(--display-track);font-size:80px;line-height:1}
  .disk-read .b{font-family:var(--ui);font-size:26px;color:var(--ink3);font-weight:var(--w-med)}
  [data-theme="B"] .disk-read .a{font-weight:300}
  [data-theme="C"] .disk-read .a{font-variation-settings:"wdth" 75,"opsz" 96}

  .col{position:absolute;left:0;top:140px;width:148px;height:572px;display:flex;flex-direction:column}
  .seg{position:relative;width:100%}
  .seg.free{height:40px;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--free-line) 6px 7px);border:1px solid var(--free-line);border-bottom:0}
  .seg.safe{height:92px;background:var(--safe)}
  .seg.review{height:142px;background:var(--review)}
  .seg.keep{height:298px;background:var(--keep)}
  .col .seg + .seg{border-top:2px solid var(--bg)}
  .col .seg.safe{border-top:0}
  [data-theme="A"] .col{border-radius:4px;overflow:hidden}
  [data-theme="B"] .col{border-radius:6px;overflow:hidden}
  [data-theme="B"] .seg.safe{box-shadow:0 0 40px rgba(235,196,122,.35);background:linear-gradient(180deg,#F1CF8C,#E5B865)}
  [data-theme="C"] .col{border:2px solid #141412;border-radius:16px;overflow:hidden;box-shadow:6px 6px 0 #141412;background:#fff}
  [data-theme="C"] .col .seg + .seg{border-top:2px solid #141412}
  [data-theme="C"] .seg.free{border:0;background:radial-gradient(#141412 1.2px,transparent 1.4px) 0 0/10px 10px,#fff}

  /* 每段旁边直接写名字和数字 */
  .lab{position:absolute;left:180px;display:flex;align-items:center;gap:14px;transform:translateY(-50%);white-space:nowrap}
  .lab::before{content:"";width:18px;height:1px;background:var(--line2);position:absolute;left:-26px;top:50%}
  .lab .k{font-size:var(--fs-body);color:var(--ink2);font-weight:var(--w-med);min-width:96px}
  .lab .v{font-family:var(--ui);font-variant-numeric:tabular-nums;font-size:var(--fn-label);font-weight:var(--w-med);color:var(--ink);letter-spacing:-.01em}
  .lab .v small{font-size:15px;color:var(--ink3);margin-left:4px;font-weight:var(--w-med)}
  .lab.safe .v{color:var(--safe)}
  [data-theme="A"] .lab.safe .v{color:var(--accent)}
  [data-theme="C"] .lab.safe .v{color:#141412;background:var(--safe);padding:0 8px;border:2px solid #141412;border-radius:8px}
  .lab.review .v{color:var(--review-ink)}
  [data-theme="A"] .lab.review .v{color:var(--review)}
  [data-theme="C"] .lab.review .v{color:#141412}
  .lab .note{font-size:var(--fs-meta);color:var(--ink3);margin-left:-4px}
  [data-theme="C"] .lab .k{font-family:var(--heading);font-weight:700;font-size:16px;color:var(--ink)}

  /* 清理后的水位线 */
  .after{position:absolute;left:-150px;width:298px;border-top:1.5px dashed var(--ink2);}
  .after span{position:absolute;right:160px;top:-26px;font-size:var(--fs-meta);color:var(--ink2);white-space:nowrap}
  .after span b{font-family:var(--ui);font-variant-numeric:tabular-nums;font-weight:var(--w-semi);color:var(--ink);font-size:13px}
  [data-theme="C"] .after{border-top:2px dashed #141412}

  /* ── C 主题装饰：左侧大色块 + 右上插画 ── */
  .panel{display:none}
  [data-theme="C"] .panel{display:block;position:absolute;left:20px;top:56px;width:700px;height:824px;background:var(--accent);
    border:2px solid #141412;border-radius:28px;box-shadow:6px 6px 0 #141412}
  [data-theme="C"] .panel::after{content:"";position:absolute;inset:0;border-radius:26px;opacity:.5;
    background:radial-gradient(rgba(20,20,18,.18) 1px,transparent 1.3px) 0 0/16px 16px}
  [data-theme="C"] .eyebrow{font-family:var(--heading);font-weight:700;font-size:22px;color:#141412}
  [data-theme="C"] .eyebrow .cnt{font-family:var(--ui);color:#141412;opacity:.6}
  [data-theme="C"] .big .u{font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 75;color:#141412;font-size:56px}
  [data-theme="C"] .split{color:rgba(20,20,18,.62)} [data-theme="C"] .split span{border-color:rgba(20,20,18,.22)}
  [data-theme="C"] .split b{color:#141412}
  [data-theme="C"] .disk-h .lbl{font-family:var(--heading);font-weight:700;font-size:22px}
  [data-theme="C"] .foot{color:rgba(20,20,18,.55)} [data-theme="C"] .foot i{color:rgba(20,20,18,.3)}
  .deco{display:none}
  [data-theme="C"] .deco{display:block;position:absolute}
  [data-theme="C"] .eyebrow .dot{width:12px;height:12px;background:#fff}

  /* A：大数字下的细衬线装饰线；B：数字柔光 */
  [data-theme="A"] .big .n{font-size:330px;margin-left:-8px}
  [data-theme="A"] .big .u{font-family:var(--display);font-style:italic;font-weight:400;font-size:64px;color:var(--ink2);letter-spacing:0}
  [data-theme="B"] .big .n{font-size:268px;color:var(--accent);text-shadow:0 0 80px rgba(235,196,122,.22)}
  [data-theme="B"] .big .u{color:#C99B4A;font-weight:300;font-size:44px}
  [data-theme="B"] .hero::before{content:"";position:absolute;left:-200px;top:80px;width:1000px;height:700px;
    background:radial-gradient(closest-side,rgba(235,196,122,.07),transparent);pointer-events:none}
</style>
</head>
<body>
  <div class="titlebar">
    <div class="brand"><span class="mark"></span>DiskWhy</div>
    <div class="tb-spacer"></div>
    <div class="tb-btn" title="设置"><svg class="i" viewBox="0 0 24 24"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg></div>
    <div class="win">
      <span><svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg></span>
      <span><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg></span>
      <span><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></span>
    </div>
  </div>

  <div class="panel"></div>
  <section class="hero">
    <div class="hero-in">
      <div class="eyebrow"><span class="dot safe"></span>可放心清理<span class="cnt num">17 项</span></div>
      <div class="big"><span class="n display">32.1</span><span class="u">GB</span></div>
      <div class="split">
        <span>系统缓存<b>14.4</b></span><span>浏览器<b>8.1</b></span><span>应用缓存<b>5.4</b></span><span>开发工具<b>4.2</b></span>
      </div>
      <div class="actions">
        <span class="btn">清理 <span class="num">32.1 GB</span></span>
        <span class="link">看看都是什么<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
      </div>
    </div>
    <div class="foot"><span>扫描完成</span><i>/</i><span class="num">55 秒</span><i>/</i><span class="num">今天 10:32</span></div>
  </section>

  <section class="disk">
    <div class="disk-h"><span class="lbl">C 盘</span><span class="pct">已用 <b>93%</b></span></div>
    <div class="disk-read"><span class="a num">185</span><span class="b num">/ 199 GB</span></div>

    <div class="col">
      <div class="seg free"></div>
      <div class="seg safe"></div>
      <div class="seg review"></div>
      <div class="seg keep"></div>
    </div>
    <!-- 标签：纵向位置 = 段中点（柱顶 132px） -->
    <div class="lab free"   style="top:160px"><span class="k">剩余</span><span class="v">14.0<small>GB</small></span></div>
    <div class="lab safe"   style="top:226px"><span class="k">可放心清理</span><span class="v">32.1<small>GB</small></span></div>
    <div class="lab review" style="top:343px"><span class="k">需你判断</span><span class="v">49.6<small>GB</small></span></div>
    <div class="lab keep"   style="top:563px"><span class="k">其他</span><span class="v">103<small>GB</small></span><span class="note">系统 · 程序 · 你的文件</span></div>

    <div class="after" style="top:273px"><span>清理后剩余 <b>46.1 GB</b></span></div>
  </section>

  <!-- C 主题插画：文件块从柱顶被弹出去 -->
  <svg class="deco" style="left:470px;top:112px" width="230" height="104" viewBox="0 0 200 92" fill="none" stroke="#141412" stroke-width="2" stroke-linejoin="round">
    <rect x="18" y="44" width="30" height="24" rx="5" fill="#FF8A76" transform="rotate(-18 33 56)"/>
    <rect x="70" y="14" width="34" height="26" rx="5" fill="#fff" transform="rotate(12 87 27)"/>
    <path d="M78 24h18M78 30h12" transform="rotate(12 87 27)"/>
    <rect x="128" y="34" width="26" height="22" rx="5" fill="#D4F24C" transform="rotate(-8 141 45)"/>
    <path d="M58 70l8-10M112 60l10-8M40 30l4-8" stroke-linecap="round"/>
    <path d="M176 18l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#141412"/>
  </svg>
</body>
</html>
