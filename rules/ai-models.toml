# AI 模型缓存。文案均为 DiskWhy 自己撰写（MIT）。
# 共同点：都能重新下载，但文件很大、下载很慢（有的还要翻墙或登录），所以一律 review，
# 办法同时给“迁到别的盘”和“删掉”。

[[rule]]
id = "huggingface-hub"
owner = "Hugging Face（transformers / diffusers 等）"
category = "model"
tier = "review"
match = ['%USERPROFILE%\.cache\huggingface\hub', '%USERPROFILE%\.cache\huggingface\transformers', '%USERPROFILE%\.cache\huggingface']
what = "从 Hugging Face 下载的 AI 模型"
why = "用 Python 跑 AI 模型（transformers、diffusers、sentence-transformers 等）时自动下载到这里"
lose = "删了可以重新下载，但模型往往几 GB 到几十 GB、下载很慢；删后第一次运行相关程序会卡在下载上。"
how = ["migrate", "delete"]
how_detail = "迁移：设置用户环境变量 HF_HOME=D:\\hf（或只设 HF_HUB_CACHE），把整个文件夹搬过去。挑着删：pip install huggingface_hub 后运行 hf cache scan 查看、hf cache delete 选择要删的模型（旧版命令是 huggingface-cli scan-cache / delete-cache）。"
refs = ["https://huggingface.co/docs/huggingface_hub/guides/manage-cache"]
verified_on = "2026-09-23"

[[rule]]
id = "huggingface-datasets"
owner = "Hugging Face datasets"
category = "model"
tier = "review"
match = ['%USERPROFILE%\.cache\huggingface\datasets']
what = "从 Hugging Face 下载的数据集缓存"
why = "用 datasets 库加载数据集时下载和处理后的文件"
lose = "删了可以重新下载处理，但可能很慢；如果是你自己处理后保存的数据要先确认。"
how = ["migrate", "delete"]
how_detail = "设置环境变量 HF_DATASETS_CACHE 或 HF_HOME 指到别的盘；不用的直接删。"
refs = ["https://huggingface.co/docs/datasets/cache"]
verified_on = "2026-09-23"

[[rule]]
id = "ollama-models"
owner = "Ollama"
category = "model"
tier = "review"
match = ['%USERPROFILE%\.ollama\models', '%USERPROFILE%\.ollama']
what = "Ollama 下载的本地大模型"
why = "你用 ollama pull / ollama run 拉过的每个模型都存在这里"
lose = "删了可以重新 ollama pull，但一个模型动辄几 GB 到几十 GB，重新下载很慢。"
how = ["migrate", "delete"]
how_detail = "迁移：退出 Ollama（托盘图标右键退出），设置用户环境变量 OLLAMA_MODELS=D:\\ollama\\models，把 models 文件夹整个搬过去，再启动 Ollama。删除：ollama list 查看，ollama rm <模型名> 删掉不用的。"
refs = ["https://docs.ollama.com/faq"]
verified_on = "2026-09-23"

[[rule]]
id = "ollama-program"
owner = "Ollama"
category = "app"
tier = "keep"
match = ['%LOCALAPPDATA%\Programs\Ollama']
what = "Ollama 的程序本体（包括显卡加速库）"
why = "lib 里是 CUDA / ROCm 等显卡加速组件，所以比较大"
lose = "直接删 Ollama 就用不了。不用了请正常卸载（模型在另一个文件夹，卸载不一定会删）。"
how = "manual"
how_detail = "“设置 > 应用”里卸载 Ollama；模型文件夹 %USERPROFILE%\\.ollama 需要另外处理。"
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "ollama-local-data"
owner = "Ollama"
category = "log"
tier = "review"
match = ['%LOCALAPPDATA%\Ollama']
what = "Ollama 的日志和下载的更新包"
why = "Ollama 运行日志（app.log、server.log）和自动更新时下载的安装包"
lose = "只是丢掉日志和已下载的更新包，不影响已装的模型。"
how = "delete"
how_detail = "退出 Ollama 后删除里面的 .log 和 updates。"
refs = ["https://docs.ollama.com/troubleshooting", "https://docs.ollama.com/windows"]
verified_on = "2026-09-24"

[[rule]]
id = "ollama-updates"
owner = "Ollama"
category = "installer"
tier = "safe"
match = ['%LOCALAPPDATA%\Ollama\updates_v2', '%LOCALAPPDATA%\Ollama\updates']
what = "Ollama 自动更新时下载的新版安装包"
why = "Ollama 官方 Windows 文档：%LOCALAPPDATA%\\Ollama 里放的是日志和下载的更新（downloaded updates）；本机 updates_v2 里是一个按哈希命名的文件夹，装着新版安装程序"
lose = "不影响已装的 Ollama 和模型；还没升级的话，Ollama 下次检查更新时会重新下载。"
how = "delete"
how_detail = "退出 Ollama（托盘图标 → Quit）后删除。"
refs = ["https://docs.ollama.com/windows"]
verified_on = "2026-09-24"

