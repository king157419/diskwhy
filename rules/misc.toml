[[rule]]
id = "outlook-ost"
owner = "Microsoft Outlook"
category = "cache"
tier = "review"
kind = "file"
match = ['%LOCALAPPDATA%\Microsoft\Outlook\*.ost']
what = "Outlook 的离线邮件缓存（.ost）"
why = "Exchange / Microsoft 365 / IMAP 邮箱在本机的副本，没网也能看邮件"
lose = "邮件在服务器上还有，删了会重新下载（可能很久）；但还没同步上去的草稿等会丢。"
how = "manual"
how_detail = "关掉 Outlook 后可以删，或在账户设置里把“脱机保留邮件”的时间调短。"
