# 开发工具的缓存、依赖和虚拟磁盘。文案均为 DiskWhy 自己撰写（MIT）。

# ───────── JavaScript ─────────

[[rule]]
id = "npm-cache"
owner = "npm"
category = "cache"
tier = "safe"
match = ['%LOCALAPPDATA%\npm-cache', '%APPDATA%\npm-cache']
what = "npm 下载过的包缓存"
why = "让下次安装同一个包不用重新下载；npx 临时运行的工具也放在这里（_npx）"
lose = "删除后下次 npm install 会重新下载，慢一些，不丢数据。"
how = ["delete", "builtin_tool"]
how_detail = "npm cache clean --force （或直接删这个文件夹）。"
refs = ["https://docs.npmjs.com/cli/v10/commands/npm-cache"]
verified_on = "2026-09-23"

[[rule]]
id = "npm-global"
owner = "npm"
category = "app"
tier = "review"
match = ['%APPDATA%\npm']
what = "用 npm install -g 全局安装的命令行工具"
why = "你（或安装脚本）全局装的 Node 命令行工具都放在这里，比如各种 AI 编程助手、构建工具"
lose = "删了这些命令就用不了，要重新 npm install -g 安装；工具自己的配置一般在别处，不会丢。"
how = "manual"
how_detail = "用 npm ls -g --depth=0 看装了哪些，npm uninstall -g <包名> 卸掉不用的。"
refs = ["https://docs.npmjs.com/cli/v10/commands/npm-uninstall"]
verified_on = "2026-09-23"

[[rule]]
id = "pnpm-store"
owner = "pnpm"
category = "cache"
tier = "safe"
match = ['%LOCALAPPDATA%\pnpm\store', '%LOCALAPPDATA%\pnpm-store', '%USERPROFILE%\.pnpm-store']
what = "pnpm 的全局包仓库"
why = "pnpm 把所有项目用到的包只存一份，项目里用硬链接指过来"
lose = "用 prune 只删没有项目在用的包，不影响现有项目；整个删掉后项目需要重新 pnpm install。"
how = "builtin_tool"
how_detail = "pnpm store prune"
refs = ["https://pnpm.io/cli/store"]
verified_on = "2026-09-23"

[[rule]]
id = "yarn-cache"
owner = "Yarn"
category = "cache"
tier = "safe"
match = ['%LOCALAPPDATA%\Yarn\Cache', '%LOCALAPPDATA%\Yarn\Berry\cache']
what = "Yarn 下载过的包缓存"
why = "让下次安装同一个包不用重新下载"
lose = "删除后下次安装会重新下载，不丢数据。"
how = ["delete", "builtin_tool"]
how_detail = "yarn cache clean"
refs = ["https://classic.yarnpkg.com/en/docs/cli/cache"]
verified_on = "2026-09-23"

[[rule]]
id = "bun-cache"
owner = "Bun"
category = "cache"
tier = "safe"
match = ['%USERPROFILE%\.bun\install\cache']
what = "Bun 下载过的包缓存"
why = "让下次安装同一个包不用重新下载"
lose = "删除后下次安装会重新下载，不丢数据。"
how = ["delete", "builtin_tool"]
how_detail = "bun pm cache rm"
refs = ["https://bun.sh/docs/install/cache"]
verified_on = "2026-09-23"

[[rule]]
id = "playwright-browsers"
owner = "Playwright"
category = "cache"
tier = "safe"
match = ['%LOCALAPPDATA%\ms-playwright']
what = "Playwright 自动化测试下载的浏览器"
why = "Playwright 跑网页自动化时用自己下载的 Chromium / Firefox / WebKit"
lose = "不丢数据；再跑 Playwright 时要重新执行 npx playwright install 下载（几百 MB）。"
how = "delete"
how_detail = "直接删，或 npx playwright uninstall --all。"
refs = ["https://playwright.dev/docs/browsers"]
verified_on = "2026-09-23"

[[rule]]
id = "electron-download-cache"
owner = "Electron / node-gyp"
category = "cache"
tier = "safe"
match = ['%LOCALAPPDATA%\electron\Cache', '%LOCALAPPDATA%\electron-builder\Cache', '%LOCALAPPDATA%\node-gyp\Cache']
what = "Electron 和原生模块编译工具下载的文件缓存"
why = "开发 Electron 应用或装需要编译的 npm 包时下载的运行时和头文件"
lose = "不丢数据；下次用到时重新下载。"
how = "delete"
how_detail = "直接删除。"
refs = []
verified_on = "2026-09-23"

