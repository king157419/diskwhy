<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DiskWhy v2 · 空间分析</title>
<script>document.documentElement.dataset.theme=(new URLSearchParams(location.search).get('t')||'A').toUpperCase()</script>
<link rel="stylesheet" href="theme.css">
<style>
  .sub{position:absolute;left:24px;right:24px;top:52px;height:44px;display:flex;align-items:center;gap:24px}
  .crumb{display:flex;align-items:center;gap:8px;font-size:var(--fs-body);color:var(--ink3)}
  .crumb b{color:var(--ink);font-weight:var(--w-semi)}
  .crumb .sep{color:var(--line2)}
  .crumb .sz{font-family:var(--ui);font-variant-numeric:tabular-nums;color:var(--ink3);font-size:var(--fs-sub);margin-left:6px}
  [data-theme="C"] .crumb b{font-family:var(--heading);font-weight:700;font-size:18px}
  .key{margin-left:auto;display:flex;gap:18px;font-size:var(--fs-sub);color:var(--ink2)}
  .key span{display:flex;align-items:center;gap:7px}
  .seg-t{display:flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;font-size:var(--fs-sub)}
  .seg-t span{padding:6px 14px;color:var(--ink2)}
  .seg-t span + span{border-left:1px solid var(--line2)}
  .seg-t .on{background:var(--ink);color:var(--bg);font-weight:var(--w-semi)}
  [data-theme="B"] .seg-t .on{background:var(--line2);color:var(--ink)}
  [data-theme="C"] .seg-t{border:2px solid #141412;border-radius:999px}
  [data-theme="C"] .seg-t span + span{border-left:2px solid #141412}
  [data-theme="C"] .seg-t .on{background:var(--accent);color:#141412}

  /* ── 方块图 ── */
  #map{position:absolute;left:24px;top:108px;width:884px;height:768px}
  .g{position:absolute;background:var(--surface);border:1px solid var(--line)}
  .g .gh{position:absolute;left:8px;right:8px;top:4px;height:18px;display:flex;gap:6px;font-size:12px;color:var(--ink2);font-weight:var(--w-med);white-space:nowrap;overflow:hidden}
  .g .gh i{font-style:normal;font-family:var(--ui);color:var(--ink3);font-variant-numeric:tabular-nums}
  .g.sel{border:2px solid var(--ink);z-index:2}
  [data-theme="A"] .g{border-radius:4px}
  [data-theme="B"] .g{background:#1A1612;border-color:#2A241E;border-radius:6px}
  [data-theme="B"] .g.sel{border-color:var(--accent)}
  [data-theme="C"] .g{border:2px solid #141412;border-radius:10px;background:#fff}
  [data-theme="C"] .g.sel{border-width:3px;box-shadow:5px 5px 0 #141412}
  [data-theme="C"] .g .gh{font-family:var(--heading);font-weight:700;color:#141412;font-size:13px}
  .lf{position:absolute;overflow:hidden;padding:7px 8px;font-size:12px;line-height:1.3}
  .lf .a{display:block;font-weight:var(--w-med);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lf .b{display:block;font-family:var(--ui);font-variant-numeric:tabular-nums;opacity:.8}
  .lf.big .a{font-size:15px} .lf.big .b{font-size:13px}
  .lf.safe{background:var(--safe);color:#fff}
  .lf.review{background:var(--review);color:#fff}
  .lf.keep{background:var(--keep);color:var(--ink)}
  .lf.mix{background:var(--keep2);color:var(--ink2)}
  [data-theme="A"] .lf{border-radius:3px}
  [data-theme="B"] .lf{border-radius:4px}
  [data-theme="B"] .lf.safe{background:#E4BC70;color:#241A0D}
  [data-theme="B"] .lf.review{background:#D97D62;color:#21120C}
  [data-theme="B"] .lf.keep{background:#40372F;color:var(--ink2)}
  [data-theme="B"] .lf.mix{background:#2E2823;color:var(--ink3)}
  [data-theme="C"] .lf{border:2px solid #141412;border-radius:8px;color:#141412}
  [data-theme="C"] .lf.review{color:#141412}
  [data-theme="C"] .lf.mix{background:repeating-linear-gradient(135deg,#F4F0E6 0 5px,#E6E1D5 5px 10px)}
  .lf.hov{outline:2px solid var(--ink);outline-offset:-2px;z-index:3}
  [data-theme="B"] .lf.hov{outline-color:#F3ECE2}

  .tip{position:absolute;z-index:10;width:236px;padding:12px 14px;background:var(--surface);border-radius:var(--r);
    box-shadow:0 16px 40px -12px rgba(0,0,0,.35),0 0 0 1px var(--line);font-size:var(--fs-sub)}
  [data-theme="B"] .tip{background:#221D18;box-shadow:0 20px 50px -10px rgba(0,0,0,.8),0 0 0 1px #3B332B}
  [data-theme="C"] .tip{border:2px solid #141412;box-shadow:4px 4px 0 #141412;border-radius:12px}
  .tip .t1{display:flex;align-items:center;gap:8px;font-weight:var(--w-semi);font-size:14px}
  .tip .t1 .s{margin-left:auto;font-family:var(--ui);font-variant-numeric:tabular-nums}
  .tip .t2{margin-top:4px;color:var(--ink3);font-size:var(--fs-meta)}
  .tip .t3{margin-top:10px;display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:var(--fs-meta)}

  /* ── 列表 ── */
  .list{position:absolute;left:932px;right:24px;top:108px;height:768px}
  .lh{height:64px;display:flex;align-items:baseline;gap:12px;padding:10px 4px 0;border-bottom:1px solid var(--line2)}
  .lh h2{font-family:var(--heading);font-size:22px;font-weight:var(--heading-w)}
  .lh .m{font-size:var(--fs-sub);color:var(--ink3)}
  .lh .m b{font-family:var(--ui);color:var(--ink2);font-weight:var(--w-med);font-variant-numeric:tabular-nums}
  .lh .sort{margin-left:auto;font-size:var(--fs-meta);color:var(--ink3)}
  .li{height:44px;display:grid;grid-template-columns:16px 26px minmax(0,1fr) auto 60px 70px;align-items:center;column-gap:6px;padding:0 4px;border-bottom:1px solid var(--line)}
  .li .ic{color:var(--ink3);display:grid;place-items:center}
  .li .ic svg{width:16px;height:16px;stroke-width:1.6}
  .li .n{font-size:14px;font-weight:var(--w-med);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .c{font-size:var(--fs-meta);color:var(--ink3);white-space:nowrap;padding:0 10px 0 8px}
  .li .br{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
  .li .br i{display:block;height:100%;background:var(--ink3)}
  [data-theme="B"] .li .br{background:#2A241E} [data-theme="B"] .li .br i{background:#7E7468}
  [data-theme="C"] .li .br{height:6px;border:1.5px solid #141412;background:#fff;border-radius:4px} [data-theme="C"] .li .br i{background:#141412}
  .li .s{text-align:right;font-family:var(--ui);font-variant-numeric:tabular-nums;font-size:15px;font-weight:var(--w-med);color:var(--ink)}
  .li .s small{font-size:11px;color:var(--ink3);margin-left:2px}
  .li.hov{background:var(--sunk)}
  [data-theme="B"] .li.hov{background:rgba(255,255,255,.04)}
  [data-theme="C"] .li.hov{background:#fff}
  .dot.mix{background:transparent;border:1.5px solid var(--ink3)}
  .li.tail .n{color:var(--ink2);font-weight:var(--w-reg)}
</style>
</head>
<body>
  <div class="titlebar">
    <div class="back"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>空间分析</div>
    <div class="tb-spacer"></div>
    <div class="win">
      <span><svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg></span>
      <span><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg></span>
      <span><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></span>
    </div>
  </div>

  <div class="sub">
    <div class="crumb"><span>C:</span><span class="sep">/</span><span>用户</span><span class="sep">/</span><b>king</b><span class="sz">98.0 GB</span></div>
    <div class="key"><span><i class="dot safe"></i>可放心清理</span><span><i class="dot review"></i>需你判断</span><span><i class="dot keep"></i>先别动</span></div>
    <div class="seg-t"><span>方块图</span><span class="on">并排</span><span>列表</span></div>
  </div>

  <div id="map"></div>

  <section class="list">
    <div class="lh"><h2>king</h2><span class="m"><b>15</b> 项 · <b>98.0</b> GB</span><span class="sort">按大小</span></div>
    <div id="rows"></div>
  </section>

<script>
const IC={
  folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  disk:'<line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/>',
  box:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
  spark:'<path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/>',
  dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20"/>',
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
};
// 用户\king 的子项（列表 + 方块图共用）
const KING=[
  {n:'.cache\\huggingface',v:14.8,t:'review',c:'AI 模型',ic:'spark',tip:1},
  {n:'下载',v:12.4,t:'keep',c:'你的文件',ic:'dl'},
  {n:'Docker 数据盘',v:11.2,t:'keep',c:'虚拟磁盘',ic:'disk'},
  {n:'.ollama',v:7.9,t:'review',c:'AI 模型',ic:'spark'},
  {n:'AppData\\Local\\Temp',v:6.4,t:'safe',c:'临时文件',ic:'clock'},
  {n:'xwechat_files',v:6.2,t:'keep',c:'微信聊天数据',ic:'chat'},
  {n:'文档',v:6.1,t:'keep',c:'你的文件',ic:'file'},
  {n:'Chrome 缓存',v:4.2,t:'safe',c:'浏览器缓存',ic:'globe'},
  {n:'.rustup',v:3.1,t:'review',c:'编译工具链',ic:'wrench'},
  {n:'桌面',v:2.9,t:'keep',c:'你的文件',ic:'folder'},
  {n:'npm-cache',v:1.6,t:'safe',c:'包缓存',ic:'box'},
  {n:'pip\\cache',v:1.0,t:'safe',c:'包缓存',ic:'box'},
  {n:'.cargo\\registry',v:1.0,t:'safe',c:'包缓存',ic:'box'},
  {n:'AppData 其余',v:13.5,t:'mix',c:'混合 142 项',ic:'folder',tail:1},
  {n:'其他',v:5.7,t:'mix',c:'零散 208 项',ic:'more',tail:1},
];
const TOP=[
  {n:'用户 \\ king',v:98.0,kids:KING,sel:1},
  {n:'Windows',v:31.4,kids:[{n:'WinSxS',v:9.8,t:'keep'},{n:'System32',v:7.6,t:'keep'},{n:'Installer',v:6.2,t:'keep'},{n:'其他',v:4.3,t:'mix'},{n:'更新安装包',v:2.4,t:'safe'},{n:'Temp',v:1.1,t:'safe'}]},
  {n:'Program Files',v:18.9,kids:[{n:'其他',v:8.4,t:'mix'},{n:'NVIDIA',v:4.1,t:'keep'},{n:'Office',v:3.6,t:'keep'},{n:'Docker',v:2.8,t:'keep'}]},
  {n:'hiberfil.sys',v:12.7,t:'review'},
  {n:'ProgramData',v:10.2,kids:[{n:'Package Cache',v:3.9,t:'review'},{n:'NVIDIA 驱动包',v:2.7,t:'review'},{n:'其他',v:2.2,t:'mix'},{n:'Docker',v:1.4,t:'keep'}]},
  {n:'pagefile.sys',v:8.0,t:'keep'},
  {n:'Program Files (x86)',v:4.6,t:'keep'},
  {n:'回收站',v:1.2,t:'review'},
];

function worst(row,side){const s=row.reduce((a,r)=>a+r.a,0);let mx=0,mn=1e18;for(const r of row){mx=Math.max(mx,r.a);mn=Math.min(mn,r.a)}return Math.max(side*side*mx/(s*s),(s*s)/(side*side*mn))}
function place(row,R,out){const s=row.reduce((a,r)=>a+r.a,0);
  if(R.w>=R.h){const cw=s/R.h;let y=R.y;for(const r of row){const h=r.a/cw;out.push({...r,x:R.x,y,w:cw,h});y+=h}R.x+=cw;R.w-=cw}
  else{const rh=s/R.w;let x=R.x;for(const r of row){const w=r.a/rh;out.push({...r,x,y:R.y,w,h:rh});x+=w}R.y+=rh;R.h-=rh}}
function squarify(items,x,y,w,h){const tot=items.reduce((a,i)=>a+i.v,0),k=w*h/tot;
  const q=items.map(i=>({...i,a:i.v*k})).sort((a,b)=>b.a-a.a),out=[],R={x,y,w,h};let row=[];
  while(q.length){const side=Math.min(R.w,R.h);if(!row.length||worst([...row,q[0]],side)<=worst(row,side))row.push(q.shift());else{place(row,R,out);row=[]}}
  if(row.length)place(row,R,out);return out}

const map=document.getElementById('map'),G=3;
function leaf(r,parent){const d=document.createElement('div');d.className='lf '+r.t;
  const w=r.w-G,h=r.h-G;Object.assign(d.style,{left:r.x+'px',top:r.y+'px',width:w+'px',height:h+'px'});
  if(w>150&&h>70)d.classList.add('big');
  if(w>62&&h>40)d.innerHTML=`<span class="a">${r.n}</span><span class="b">${r.v.toFixed(1)} GB</span>`;
  else if(w>40&&h>22)d.innerHTML=`<span class="b">${r.v.toFixed(1)}</span>`;
  if(r.tip)d.classList.add('hov');
  parent.appendChild(d);return d}
const W=884,H=768;
for(const r of squarify(TOP,0,0,W,H)){
  if(!r.kids){leaf(r,map);continue}
  const g=document.createElement('div');g.className='g'+(r.sel?' sel':'');
  Object.assign(g.style,{left:r.x+'px',top:r.y+'px',width:(r.w-G)+'px',height:(r.h-G)+'px'});
  g.innerHTML=`<div class="gh">${r.n}<i>${r.v.toFixed(1)} GB</i></div>`;map.appendChild(g);
  const iw=r.w-G-8,ih=r.h-G-30;
  for(const c of squarify(r.kids,0,0,iw,ih)){const el=leaf(c,g);el.style.left=(c.x+4)+'px';el.style.top=(c.y+26)+'px';
    if(c.tip){const tip=document.createElement('div');tip.className='tip';
      tip.innerHTML=`<div class="t1"><i class="dot review"></i>huggingface<span class="s">14.8 GB</span></div>
        <div class="t2">Hugging Face 下载的 AI 模型</div>
        <div class="t3"><span class="tag">要重下载</span>模型几 GB 到几十 GB</div>`;
      tip.style.left=(r.x+c.x+c.w*0.45)+'px';tip.style.top=(r.y+c.y+26+c.h*0.55)+'px';map.appendChild(tip)}}
}
const max=Math.max(...KING.map(k=>k.v));
document.getElementById('rows').innerHTML=KING.map(k=>`<div class="li${k.tip?' hov':''}${k.tail?' tail':''}">
  <i class="dot ${k.t}"></i><span class="ic"><svg class="i" viewBox="0 0 24 24">${IC[k.ic]}</svg></span>
  <span class="n">${k.n}</span><span class="c">${k.c}</span>
  <span class="br"><i style="width:${(k.v/max*100).toFixed(1)}%"></i></span>
  <span class="s">${k.v.toFixed(1)}<small>GB</small></span></div>`).join('');
</script>
</body>
</html>
