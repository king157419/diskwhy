# 浏览器与 Chromium / Electron 系缓存。文案均为 DiskWhy 自己撰写（MIT）。
#
# Chromium 内核的程序（Chrome、Edge、Brave、Vivaldi、Opera，以及 VS Code、Cursor、Claude、Discord、
# 飞书、QQ 等 Electron 应用）缓存目录名都一样：Cache、Code Cache、GPUCache、DawnCache、
# Service Worker\CacheStorage……所以除了各浏览器的专用规则，最后还有几条通配规则统一处理。
# 通配规则用 when_child 要求目录里有 Chromium 缓存特有的文件，避免误伤同名的普通文件夹。

# ───────── Google Chrome ─────────

[[rule]]
id = "chrome-profile"
owner = "Google Chrome"
category = "userdata"
tier = "keep"
match = ['%LOCALAPPDATA%\Google\Chrome\User Data']
what = "Chrome 的用户资料：书签、密码、历史记录、扩展、登录状态"
why = "Chrome 把每个用户（Profile）的所有个人数据放在这里"
lose = "不能整个删：没开同步的话，书签、保存的密码、扩展和设置会全部丢失。里面的缓存子文件夹可以清（会单独标成绿色）。"
how = "builtin_tool"
how_detail = "想腾空间请在 Chrome 里：设置 > 隐私和安全 > 删除浏览数据，勾选“缓存的图片和文件”。"
refs = ["https://support.google.com/chrome/answer/2392709"]
verified_on = "2026-09-23"

[[rule]]
id = "chrome-cache"
owner = "Google Chrome"
category = "cache"
tier = "safe"
match = [
  '%LOCALAPPDATA%\Google\Chrome\User Data\*\Cache',
  '%LOCALAPPDATA%\Google\Chrome\User Data\*\Code Cache',
  '%LOCALAPPDATA%\Google\Chrome\User Data\*\GPUCache',
  '%LOCALAPPDATA%\Google\Chrome\User Data\*\DawnCache',
  '%LOCALAPPDATA%\Google\Chrome\User Data\*\DawnGraphiteCache',
  '%LOCALAPPDATA%\Google\Chrome\User Data\*\DawnWebGPUCache',
  '%LOCALAPPDATA%\Google\Chrome\User Data\*\Service Worker\CacheStorage',
  '%LOCALAPPDATA%\Google\Chrome\User Data\*\Service Worker\ScriptCache',
  '%LOCALAPPDATA%\Google\Chrome\User Data\ShaderCache',
  '%LOCALAPPDATA%\Google\Chrome\User Data\GrShaderCache',
  '%LOCALAPPDATA%\Google\Chrome\User Data\GraphiteDawnCache',
]
what = "Chrome 的网页缓存（图片、脚本、显卡着色器等）"
why = "打开过的网页先存一份，下次打开更快"
lose = "不丢书签、密码和历史；删掉后网页第一次打开会慢一点。个别网站离线缓存的内容会重新下载。"
how = ["delete", "builtin_tool"]
how_detail = "关掉 Chrome 后删除；或在 Chrome 的“删除浏览数据”里勾选“缓存的图片和文件”。"
refs = ["https://support.google.com/chrome/answer/2392709"]
verified_on = "2026-09-23"

[[rule]]
id = "chrome-on-device-model"
owner = "Google Chrome"
category = "model"
tier = "review"
lose_kind = "feature"
lose_short = "AI 功能用不了"
match = ['%LOCALAPPDATA%\Google\Chrome\User Data\OptGuideOnDeviceModel']
what = "Chrome 下载到本机的 AI 模型（给浏览器内置的 AI 功能用）"
why = "Chrome 的一些 AI 功能（比如帮你写字、总结网页）在本机运行，需要先下载一个几 GB 的模型"
lose = "删了这些本机 AI 功能暂时不能用；只要功能还开着，Chrome 以后很可能会自动重新下载，空间又会被占回去。不影响书签、密码和正常上网。"
how = ["delete", "manual"]
how_detail = "关掉 Chrome 后可以删。想让它不再下载，需要在 Chrome 设置里关掉用到本机 AI 的功能；不同版本开关位置不一样，我不确定具体叫什么。"
refs = ["https://developer.chrome.com/docs/ai/built-in"]
verified_on = "2026-09-23"

[[rule]]
id = "google-local"
owner = "Google"
category = "userdata"
tier = "keep"
scope = "self"
match = ['%LOCALAPPDATA%\Google', '%LOCALAPPDATA%\Google\Chrome']
what = "Google 家软件（主要是 Chrome）的本机数据"
why = "Chrome、Google 更新程序等都放在这个文件夹下"
lose = "不能整个删，Chrome 的书签和密码在里面。请点进去看具体是哪块大。"
how = "none"
how_detail = ""
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "chrome-program"
owner = "Google Chrome"
category = "app"
tier = "keep"
match = ['%ProgramFiles%\Google\Chrome', '%ProgramFiles(x86)%\Google\Chrome', '%LOCALAPPDATA%\Google\Chrome\Application']
what = "Chrome 浏览器的程序本体"
why = "安装 Chrome 时放程序文件的地方；刚更新完时可能同时有新旧两个版本号文件夹，重启 Chrome 后旧的会自动清掉"
lose = "直接删 Chrome 就打不开了。不用 Chrome 的话请正常卸载。"
how = "manual"
how_detail = "“设置 > 应用 > 已安装的应用”里卸载 Google Chrome。"
refs = []
verified_on = "2026-09-23"

