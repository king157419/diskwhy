[workspace]
resolver = "2"
members = ["crates/diskwhy-core", "crates/diskwhy-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# 阶段 J 闪退取证：panic 的 backtrace / minidump 要能对上函数名和行号——只要行号表（不是完整调试信息），
# 不剥符号，调试信息放进单独的 .pdb（MSVC 上 packed = 和 exe 同目录的 diskwhy.pdb；exe 本身几乎不变大）。
debug = "line-tables-only"
strip = "none"
split-debuginfo = "packed"
