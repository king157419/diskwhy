# 其他常见软件和工具。文案均为 DiskWhy 自己撰写（MIT）。

# ───────── Claude 桌面版 / 命令行 AI 工具 ─────────

[[rule]]
id = "claude-desktop-vm"
owner = "Claude 桌面版（Anthropic）"
category = "vm"
tier = "review"
lose_kind = "irreversible"
lose_short = "工作区数据会丢"
match = [
  '%APPDATA%\Claude\vm_bundles',
  '%LOCALAPPDATA%\Packages\Claude_*\LocalCache\Roaming\Claude\vm_bundles',
]
what = "Claude 桌面版 Cowork 功能在本机跑的 Linux 虚拟机（“工作区”）"
why = "Claude 帮助中心写明 Windows 版的 Cowork 需要系统的“虚拟机平台”（Virtual Machine Platform）功能。claudevm.bundle 里 rootfs.vhdx（Linux 系统盘，约 8 GB）、vmlinuz、initrd 是下载来的工作区镜像，sessiondata.vhdx 是 Cowork 会话自己的数据盘（单独说明）；由 CoworkVMService 服务管理。商店版 Claude 的这份文件同时显示在 AppData\\Roaming\\Claude 和 Packages\\Claude_…\\LocalCache\\Roaming\\Claude，是同一份"
lose = "rootfs.vhdx / vmlinuz / initrd 删了，下次用 Cowork 会重新下载（约 8 GB），所以只有“不再用 Cowork”时删才真正腾出空间。sessiondata.vhdx 里是 Cowork 会话的数据，删了会丢。官方没有写清理办法，上面这些来自两篇实测文章，我没有在本机试删。"
how = ["builtin_tool", "manual"]
how_detail = "不用 Cowork：完全退出 Claude（服务 CoworkVMService 也会停），再删 rootfs.vhdx、vmlinuz、initrd；想留会话数据就别动 sessiondata.vhdx。工作区坏了：优先用 Claude 报错界面里的“重装工作区”按钮（据实测它保留 sessiondata.vhdx），不要整个删 vm_bundles。"
refs = [
  "https://support.claude.com/en/articles/12622703-deploy-claude-desktop-for-windows",
  "https://blog.kamsker.at/blog/cowork-windows-broken",
  "https://brycewatson.com/blog/18-cowork-vm-diagnostic-guide",
]
verified_on = "2026-09-24"

[[rule]]
id = "claude-cowork-sessiondata"
owner = "Claude 桌面版（Anthropic）"
category = "userdata"
tier = "keep"
kind = "file"
match = [
  '%APPDATA%\Claude\vm_bundles\claudevm.bundle\sessiondata.vhdx',
  '%LOCALAPPDATA%\Packages\Claude_*\LocalCache\Roaming\Claude\vm_bundles\claudevm.bundle\sessiondata.vhdx',
]
what = "Claude Cowork 会话的数据盘（虚拟磁盘文件）"
why = "Cowork 工作区虚拟机里保存会话状态的磁盘；实测文章指出“重装工作区”按钮会保留它，而手动删整个 vm_bundles 会把它一起删掉"
lose = "删了之前 Cowork 会话里的数据就没了。"
how = "manual"
how_detail = "别单独删。确实不再用 Cowork、也不要以前的会话了，再连同整个 vm_bundles 一起删（先完全退出 Claude）。"
refs = [
  "https://brycewatson.com/blog/18-cowork-vm-diagnostic-guide",
  "https://blog.kamsker.at/blog/cowork-windows-broken",
]
verified_on = "2026-09-24"

[[rule]]
id = "claude-desktop-data"
owner = "Claude 桌面版（Anthropic）"
category = "userdata"
tier = "review"
lose_kind = "relogin"
lose_short = "桌面版要重新登录"
match = ['%APPDATA%\Claude']
what = "Claude 桌面版的本地数据：登录信息、设置、界面缓存、Cowork 虚拟机"
why = "Claude 桌面版是 Electron 程序，数据放在这里。商店版的这个文件夹同时显示在 Packages\\Claude_…\\LocalCache\\Roaming\\Claude（Windows 对打包应用 AppData 的重定向，同一份文件，别算两遍）"
lose = "整个删要重新登录、丢本地设置和本地会话记录；Cache、Code Cache、GPUCache 等界面缓存可以放心清（单独标绿），vm_bundles 见它自己的说明。"
how = "manual"
how_detail = "点进去只清标绿的缓存子文件夹；不用了就在“设置 > 应用”里卸载 Claude。"
refs = ["https://learn.microsoft.com/en-us/windows/msix/desktop/desktop-to-uwp-behind-the-scenes"]
verified_on = "2026-09-24"

[[rule]]
id = "claude-desktop-package"
owner = "Claude 桌面版（Anthropic，商店版）"
category = "userdata"
tier = "review"
lose_kind = "unsure"
lose_short = "混着别的程序数据"
scope = "self"
match = ['%LOCALAPPDATA%\Packages\Claude_*']
what = "商店版 Claude 桌面版的应用包文件夹"
why = "里面的 LocalCache\\Roaming\\Claude 是 Claude 自己的数据；LocalCache\\Local、LocalCache\\Roaming 里的其他文件夹是在 Claude 里运行的程序（比如 Claude Code 执行的命令、它装的工具）往 AppData 写的文件——Windows 会把打包应用及其子进程新建的 AppData 文件存进这里，同时在原位置显示"
lose = "不能整个删。点进去看：每个子文件夹 DiskWhy 会按它在 AppData 里对应的真实位置来说明。卸载 Claude 时，Windows 会把这里的文件（包括其他程序借道写进来的）一起删掉。"
how = "none"
how_detail = ""
refs = ["https://learn.microsoft.com/en-us/windows/msix/desktop/desktop-to-uwp-behind-the-scenes"]
verified_on = "2026-09-24"

[[rule]]
id = "claude-code-data"
owner = "Claude Code（Anthropic 命令行工具）"
category = "userdata"
tier = "review"
lose_kind = "irreversible"
lose_short = "历史对话全没了"
match = ['%USERPROFILE%\.claude']
what = "Claude Code 的配置、会话记录和插件"
why = "Claude Code 把设置、每个项目的对话记录（projects）、安装的技能和插件放在这里"
lose = "删了会丢设置、插件和所有历史对话（没法再继续以前的会话）。projects 子文件夹是对话记录，最占地方。"
how = "manual"
how_detail = "只想腾空间的话，可以删 projects 里你确定不再需要的旧项目对话记录；settings.json、CLAUDE.md、skills 等配置不要删。"
refs = ["https://docs.anthropic.com/en/docs/claude-code/settings"]
verified_on = "2026-09-23"

[[rule]]
id = "codex-cli-data"
owner = "Codex（OpenAI，命令行 / 桌面版 / 编辑器插件共用）"
category = "userdata"
tier = "review"
lose_kind = "irreversible"
lose_short = "对话和图片会没了"
match = ['%USERPROFILE%\.codex']
what = "Codex（命令行 / 桌面版 / 编辑器插件共用）的配置、登录信息、会话记录和生成的文件"
why = "OpenAI 文档：Codex 把本地状态放在 CODEX_HOME（默认 ~\\.codex），包括 config.toml、auth.json、会话记录。本机看到：sessions（按日期存的对话记录，最大）、thread_history / logs 等 .sqlite 数据库、generated_images（让 Codex 生成的图片）、.sandbox-bin、.tmp、plugins"
lose = "删 sessions 里的旧日期文件夹只会丢那些历史对话；generated_images 是你让它生成的图片，删了就没了；auth.json、config.toml 是登录和配置，删了要重新登录和配置。.tmp 看名字是临时文件，但官方没说明能不能删，我不确定。"
how = "manual"
how_detail = "只删 sessions 里你不需要的旧日期文件夹；想要的图片先从 generated_images 挪出来；配置和数据库文件别动。也可以在 config.toml 里用 history 设置限制历史大小。"
refs = ["https://developers.openai.com/codex/config-advanced"]
verified_on = "2026-09-24"

