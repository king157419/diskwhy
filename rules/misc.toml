# ───────── 游戏 / 外设 ─────────

[[rule]]
id = "steam-library"
owner = "Steam"
category = "userdata"
tier = "keep"
match = ['%ProgramFiles(x86)%\Steam\steamapps\common', '%ProgramFiles(x86)%\Steam\steamapps']
