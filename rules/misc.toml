scope = "self"
match = ['%USERPROFILE%\.vscode']
what = "VS Code 的扩展和启动参数所在的文件夹"
why = "官方文档：扩展装在 %USERPROFILE%\\.vscode\\extensions（里面的扩展有单独的规则）。argv.json 是启动参数；cli 子文件夹从名字看是 VS Code 命令行工具（code tunnel 等）用的，我没在官方文档里找到单独说明"
lose = "别整个删：所有扩展都会消失，要重新安装；argv.json 里的启动参数也会丢。"
how = "migrate"
how_detail = "扩展多、C 盘紧张时，可以用 --extensions-dir 启动参数或 VSCODE_EXTENSIONS 环境变量把扩展目录放到别的盘（官方文档写明支持）。"
refs = ["https://code.visualstudio.com/docs/configure/extensions/extension-marketplace"]
verified_on = "2026-09-23"

