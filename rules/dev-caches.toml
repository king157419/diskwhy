[[rule]]
id = "conda-pkgs"
owner = "conda（Anaconda / Miniconda）"
category = "cache"
tier = "safe"
match = [
  '%USERPROFILE%\miniconda3\pkgs', '%USERPROFILE%\anaconda3\pkgs', '%USERPROFILE%\miniforge3\pkgs',
  '%ProgramData%\miniconda3\pkgs', '%ProgramData%\anaconda3\pkgs',
  '%USERPROFILE%\.conda\pkgs', '%LOCALAPPDATA%\conda\conda\pkgs',
]
what = "conda 下载过的安装包缓存"
why = "conda 装包时先下载解压到这里，再链接到各个环境"
lose = "用 conda clean 清理不会影响已经建好的环境；以后装同样的包会重新下载。"
how = "builtin_tool"
how_detail = "conda clean --all （先加 --dry-run 看看会删什么）。不建议手动删文件夹。"
refs = ["https://docs.conda.io/projects/conda/en/latest/commands/clean.html"]
verified_on = "2026-09-23"

[[rule]]
id = "conda-envs"
owner = "conda（Anaconda / Miniconda）"
category = "userdata"
tier = "keep"
match = [
  '%USERPROFILE%\miniconda3\envs', '%USERPROFILE%\anaconda3\envs', '%USERPROFILE%\miniforge3\envs',
  '%ProgramData%\miniconda3\envs', '%ProgramData%\anaconda3\envs',
  '%USERPROFILE%\.conda\envs',
]
what = "你建的 conda 环境（每个子文件夹是一套独立的 Python 和库）"
why = "给不同项目准备的运行环境"
lose = "删了环境里的库和配置都没了，项目跑不起来，要照原样重建（可能很费时，版本还不一定装得回来）。"
how = "migrate"
how_detail = "迁到 D 盘：先 conda env export -n 环境名 > env.yml 备份；在 .condarc 里加 envs_dirs: [D:\\conda\\envs]；再 conda env create -f env.yml 在新位置重建，确认能用后 conda env remove -n 旧环境。不用的环境直接 conda env remove -n 环境名。"
refs = ["https://docs.conda.io/projects/conda/en/latest/user-guide/tasks/manage-environments.html"]
verified_on = "2026-09-23"

[[rule]]
id = "conda-base"
owner = "conda（Anaconda / Miniconda）"
category = "app"
tier = "keep"
match = ['%USERPROFILE%\miniconda3', '%USERPROFILE%\anaconda3', '%USERPROFILE%\miniforge3', '%ProgramData%\miniconda3', '%ProgramData%\anaconda3']
what = "conda 本体（base 环境）"
why = "安装 Anaconda / Miniconda 时放的 Python 和 conda 程序"
lose = "直接删会让 conda 和所有环境都不能用。不用了请正常卸载。"
how = "manual"
how_detail = "先用 conda clean --all 清缓存；不用了在“设置 > 应用”里卸载。"
refs = []
verified_on = "2026-09-23"

