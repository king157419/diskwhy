# 其他常见软件和工具。文案均为 DiskWhy 自己撰写（MIT）。

# ───────── Claude 桌面版 / 命令行 AI 工具 ─────────

[[rule]]
id = "claude-desktop-vm"
owner = "Claude 桌面版（Anthropic）"
category = "vm"
tier = "review"
match = [
  '%APPDATA%\Claude\vm_bundles',
  '%LOCALAPPDATA%\Packages\Claude_*\LocalCache\Roaming\Claude\vm_bundles',
]
what = "Claude 桌面版下载的本地 Linux 虚拟机镜像"
why = "从文件名看（rootfs.vhdx、vmlinuz、initrd、sessiondata.vhdx），这是 Claude 桌面版在本机隔离环境里执行任务用的小型虚拟机。注意：商店版 Claude 的数据会同时出现在 AppData\\Roaming\\Claude 和 Packages\\Claude_…\\LocalCache\\Roaming\\Claude 两处，其实是同一份，别算两遍"
lose = "我不确定删了之后具体哪些功能受影响：用到它的功能可能要重新下载镜像（几 GB）；sessiondata.vhdx 看名字可能存有会话数据，删了可能丢失之前的工作记录。"
how = "manual"
how_detail = "建议先在 Claude 桌面版的设置里找相关功能的开关或清理选项；确实不用那项功能再考虑删除（先完全退出 Claude）。"
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "claude-desktop-data"
owner = "Claude 桌面版（Anthropic）"
category = "userdata"
tier = "review"
match = ['%APPDATA%\Claude', '%LOCALAPPDATA%\Packages\Claude_*']
what = "Claude 桌面版的本地数据：登录信息、设置、界面缓存，以及虚拟机镜像"
why = "Claude 桌面版是 Electron 程序，数据放在这里；商店版会通过应用包映射同时出现在 Packages\\Claude_… 下（同一份数据，看起来像两份）"
lose = "整个删要重新登录、丢本地设置；Cache、Code Cache、GPUCache 等界面缓存可以放心清（单独标绿），vm_bundles 见它自己的说明。"
how = "manual"
how_detail = "点进去只清标绿的缓存子文件夹；不用了就在“设置 > 应用”里卸载 Claude。"
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "claude-code-data"
owner = "Claude Code（Anthropic 命令行工具）"
category = "userdata"
tier = "review"
match = ['%USERPROFILE%\.claude']
what = "Claude Code 的配置、会话记录和插件"
why = "Claude Code 把设置、每个项目的对话记录（projects）、安装的技能和插件放在这里"
lose = "删了会丢设置、插件和所有历史对话（没法再继续以前的会话）。projects 子文件夹是对话记录，最占地方。"
how = "manual"
how_detail = "只想腾空间的话，可以删 projects 里你确定不再需要的旧项目对话记录；settings.json、CLAUDE.md、skills 等配置不要删。"
refs = ["https://docs.anthropic.com/en/docs/claude-code/settings"]
verified_on = "2026-09-23"

[[rule]]
id = "codex-cli-data"
owner = "Codex CLI（OpenAI 命令行工具）"
category = "userdata"
tier = "review"
match = ['%USERPROFILE%\.codex']
what = "Codex 命令行工具的配置、登录信息和会话记录"
why = "sessions 子文件夹按日期存每次对话的记录，时间长了会很大"
lose = "删 sessions 里的旧记录只会丢那些历史对话；auth.json、config.toml 是登录和配置，删了要重新登录和配置。"
how = "manual"
how_detail = "只删 sessions 里你不需要的旧日期文件夹。"
refs = ["https://github.com/openai/codex"]
verified_on = "2026-09-23"

[[rule]]
id = "dot-cache-root"
owner = "各类命令行工具"
category = "cache"
tier = "review"
scope = "self"
match = ['%USERPROFILE%\.cache']
what = "命令行工具放缓存的通用文件夹（.cache）"
why = "很多从 Linux 移植来的工具（Python 库、AI 工具等）习惯把缓存放在 ~/.cache"
lose = "不能一概而论：里面多数是缓存，但有的工具把模型或重要数据也放这里。请点进去逐项看。"
how = "none"
how_detail = ""
refs = []
verified_on = "2026-09-23"

# ───────── OneDrive / Office ─────────

[[rule]]
id = "onedrive-folder"
owner = "OneDrive"
category = "userdata"
tier = "keep"
match = ['%USERPROFILE%\OneDrive', '%USERPROFILE%\OneDrive - *']
what = "OneDrive 同步文件夹"
why = "你的云盘文件在本机的副本"
lose = "在这里删文件，云上也会跟着删掉！想腾本地空间应该用“释放空间”，而不是删除。"
how = "builtin_tool"
how_detail = "在资源管理器里右键文件夹 → “释放空间”（Free up space），文件变成只在云端，本地几乎不占地方；打开时自动下载。"
refs = ["https://support.microsoft.com/en-us/office/save-disk-space-with-onedrive-files-on-demand-for-windows-0e6860d3-d9f3-4971-b321-7092438fb38e"]
verified_on = "2026-09-23"

[[rule]]
id = "onedrive-app"
owner = "OneDrive"
category = "app"
tier = "keep"
match = ['%LOCALAPPDATA%\Microsoft\OneDrive']
what = "OneDrive 客户端程序和它的同步记录"
why = "OneDrive 默认只给当前账户安装，程序和同步数据库放在这里"
lose = "删了 OneDrive 会坏掉，可能需要重新同步全部文件。"
how = "manual"
how_detail = "不用 OneDrive 的话在“设置 > 应用”里卸载 Microsoft OneDrive。"
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "office-program"
owner = "Microsoft Office"
category = "app"
tier = "keep"
match = ['%ProgramFiles%\Microsoft Office', '%ProgramFiles(x86)%\Microsoft Office', '%ProgramFiles%\Common Files\microsoft shared\ClickToRun']
what = "Microsoft Office（Word、Excel、PowerPoint 等）的程序本体"
why = "安装 Office 时放程序文件的地方；root\\vfs 是即点即用版本的虚拟化文件"
lose = "直接删 Office 就用不了，还可能留下无法卸载的残留。"
how = "manual"
how_detail = "“设置 > 应用”里卸载或“修改”去掉不用的组件。"
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "office-file-cache"
owner = "Microsoft Office"
category = "cache"
tier = "review"
match = ['%LOCALAPPDATA%\Microsoft\Office\16.0\OfficeFileCache']
what = "Office 上传中心的文件缓存"
why = "打开 OneDrive / SharePoint 上的文档时 Office 在本机缓存一份"
lose = "一般能重新下载；但如果有还没上传成功的改动，删了就丢。"
how = "builtin_tool"
how_detail = "打开 Office 上传中心（或 Word → 文件 → 选项 → 保存 → 缓存设置）点“删除缓存的文件”。"
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "outlook-ost"
owner = "Microsoft Outlook"
category = "cache"
tier = "review"
kind = "file"
match = ['%LOCALAPPDATA%\Microsoft\Outlook\*.ost']
what = "Outlook 的离线邮件缓存（.ost）"
why = "Exchange / Microsoft 365 / IMAP 邮箱在本机的副本，没网也能看邮件"
lose = "邮件在服务器上还有，删了会重新下载（可能很久）；但还没同步上去的草稿等会丢。"
how = "manual"
how_detail = "关掉 Outlook 后可以删，或在账户设置里把“脱机保留邮件”的时间调短。"
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "outlook-pst"
owner = "Microsoft Outlook"
category = "userdata"
tier = "keep"
kind = "file"
match = ['%LOCALAPPDATA%\Microsoft\Outlook\*.pst', '%USERPROFILE%\Documents\Outlook Files\*.pst']
what = "Outlook 数据文件（.pst）：存档或本地邮箱"
why = "POP 邮箱和邮件存档都存在这种文件里"
lose = "这很可能是只在本机的邮件，删了就没了。"
how = "migrate"
how_detail = "关掉 Outlook，把 .pst 文件搬到别的盘，再在 Outlook“账户设置 > 数据文件”里重新打开它。"
refs = []
verified_on = "2026-09-23"

# ───────── 显卡驱动 ─────────

[[rule]]
id = "gpu-shader-cache"
owner = "显卡驱动（NVIDIA / AMD / Intel）"
category = "cache"
tier = "safe"
match = [
  '%LOCALAPPDATA%\NVIDIA\DXCache', '%LOCALAPPDATA%\NVIDIA\GLCache', '%APPDATA%\NVIDIA\ComputeCache',
  '%LOCALAPPDATA%\AMD\DxCache', '%LOCALAPPDATA%\AMD\DxcCache', '%LOCALAPPDATA%\AMD\GLCache', '%LOCALAPPDATA%\AMD\VkCache',
  '%LOCALAPPDATA%\Intel\ShaderCache',
]
what = "显卡驱动的着色器缓存"
why = "游戏和图形程序第一次运行时编译的着色器存在这里，下次加载更快、更少卡顿"
lose = "不丢数据；删掉后游戏头几次加载会慢一点、可能短暂卡顿，缓存会重新生成。"
how = ["delete", "builtin_tool"]
how_detail = "关掉游戏后直接删；NVIDIA 控制面板“着色器缓存大小”可以限制上限。"
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "nvidia-local"
owner = "NVIDIA 显卡驱动"
category = "cache"
tier = "review"
scope = "self"
match = ['%LOCALAPPDATA%\NVIDIA', '%LOCALAPPDATA%\AMD']
what = "显卡驱动在本机的缓存文件夹"
why = "主要是着色器缓存（DXCache / GLCache 等）"
lose = "请点进去看：着色器缓存可以放心清（标绿）。"
how = "none"
how_detail = ""
refs = []
verified_on = "2026-09-23"

[[rule]]
id = "nvidia-app-updates"
owner = "NVIDIA App"
category = "installer"
tier = "review"
match = ['%ProgramData%\NVIDIA Corporation\NVIDIA App\UpdateFramework\ota-artifacts', '%ProgramData%\NVIDIA Corporation\Downloader']
